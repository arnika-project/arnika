name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Supersede in-flight runs for the same PR, so a rapid second push does not
# queue behind the run it already obsoletes. Pushes to main are never
# cancelled: every commit there keeps its own result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.3
          args: --timeout=5m

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        env:
          GOEXPERIMENT: runtimesecret
        run: go test -v ./...

      # The container lab in ci/e2e: two Arnika peers over real WireGuard and
      # the KMS simulator. Its own module, so it needs no GOEXPERIMENT and does
      # not pull testcontainers into Arnika's go.mod, and `go test ./...` above
      # does not see it. Same command as locally, which is the point of it.
      - name: End-to-end container lab
        run: go test -v -timeout 15m ./...
        working-directory: ci/e2e

  build:
    name: Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin]
        goarch: [amd64, arm64]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Download dependencies
        run: go mod download

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
          GOEXPERIMENT: runtimesecret
        run: |
          go build ./...

  writers:
    name: Key writer builds
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Download dependencies
        run: go mod download

      - name: Build, vet and conflict-check every writer
        env:
          GOEXPERIMENT: runtimesecret
          CGO_ENABLED: 0
        run: |
          set -euo pipefail

          # "<build tag>:<space-separated supported GOOS values>"
          # Adding a writer means adding one line here. See KEYCONTROL.md.
          WRITERS=(
            "wireguard_netlink:linux darwin"
            "wireguard_mikrotik:linux darwin"
            "wireguard_netlink_netns:linux"
          )
          ALL_GOOS=(linux darwin)

          TAGS=()
          for entry in "${WRITERS[@]}" ; do TAGS+=("${entry%%:*}") ; done

          echo "::group::Build each writer for its supported platforms"
          for entry in "${WRITERS[@]}" ; do
            tag="${entry%%:*}"
            for goos in ${entry#*:} ; do
              for goarch in amd64 arm64 ; do
                echo "-> $tag $goos/$goarch"
                GOOS="$goos" GOARCH="$goarch" go build -tags "$tag" -o /dev/null .
              done
            done
          done
          echo "::endgroup::"

          echo "::group::Vet each writer"
          for entry in "${WRITERS[@]}" ; do
            tag="${entry%%:*}"
            first_goos="$(echo "${entry#*:}" | awk '{print $1}')"
            echo "-> $tag (GOOS=$first_goos)"
            GOOS="$first_goos" go vet -tags "$tag" ./...
          done
          echo "::endgroup::"

          echo "::group::Unsupported platforms must NOT build"
          for entry in "${WRITERS[@]}" ; do
            tag="${entry%%:*}"
            supported=" ${entry#*:} "
            for goos in "${ALL_GOOS[@]}" ; do
              case "$supported" in *" $goos "*) continue ;; esac
              if GOOS="$goos" GOARCH=arm64 go build -tags "$tag" -o /dev/null . 2>/dev/null ; then
                echo "::error::$tag built for $goos, which it does not support - its platform constraint has been lost"
                exit 1
              fi
              echo "-> $tag correctly refuses $goos"
            done
          done
          echo "::endgroup::"

          echo "::group::Two writer tags must never compile together"
          for ((i = 0; i < ${#TAGS[@]}; i++)) ; do
            for ((j = i + 1; j < ${#TAGS[@]}; j++)) ; do
              pair="${TAGS[i]} ${TAGS[j]}"
              if go build -tags "$pair" -o /dev/null . 2>/dev/null ; then
                echo "::error::tags '$pair' built; expected duplicate getKeyWriterService"
                exit 1
              fi
              echo "-> '$pair' correctly fails"
            done
          done
          echo "::endgroup::"

  readers:
    name: Key reader builds
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Download dependencies
        run: go mod download

      - name: Build, vet and conflict-check every reader
        env:
          GOEXPERIMENT: runtimesecret
          CGO_ENABLED: 0
        run: |
          set -euo pipefail

          # One family per reader port. Adding a reader means adding its tag to
          # the family it belongs to. See KEYCONTROL.md.
          QKD=(qkd_kms qkd_none)

          echo "::group::Build and vet every reader"
          for qkd in "${QKD[@]}" ; do
            echo "-> $qkd"
            go build -tags "$qkd" -o /dev/null .
            go vet -tags "$qkd" ./...
          done
          echo "::endgroup::"

          echo "::group::Two tags from the same family must never compile together"
          for pair in "${QKD[*]}" ; do
            if go build -tags "$pair" -o /dev/null . 2>/dev/null ; then
              echo "::error::tags '$pair' built; expected a redeclared factory"
              exit 1
            fi
            echo "-> '$pair' correctly fails"
          done
          echo "::endgroup::"

